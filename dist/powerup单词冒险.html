<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>PowerUp 单词冒险</title>
  <style>
:root{
  --bg:#FFF7E8;
  --card:#FFFFFF;
  --ink:#3a2f1e;
  --ink-soft:#6b5b45;
  --amber:#EF9F27; --amber-d:#BA7517;
  --teal:#1D9E75; --teal-d:#0F6E56;
  --blue:#378ADD; --blue-d:#185FA5;
  --coral:#E24B4A; --coral-d:#A32D2D;
  --pink:#D4537E;
  --purple:#7F77DD; --purple-d:#534AB7;
  --green:#639922;
  --radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-user-select:none;user-select:none;
  overflow-x:hidden;
  touch-action:manipulation;
}
.app{max-width:1100px;margin:0 auto;padding:16px 18px 40px;min-height:100%;}
.hidden{display:none !important;}

/* 顶部栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand .logo{width:56px;height:56px;border-radius:16px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:30px;}
.brand h1{font-size:26px;margin:0;font-weight:800;}
.brand p{margin:2px 0 0;color:var(--teal-d);font-size:15px;}
.stats{display:flex;gap:10px;}
.chip{background:var(--card);border-radius:16px;padding:8px 14px;text-align:center;min-width:64px;box-shadow:0 3px 0 rgba(0,0,0,.06);}
.chip .ico{font-size:20px;}
.chip .val{font-size:18px;font-weight:800;color:var(--amber-d);}

/* 级别切换 */
.tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.tab{background:var(--card);color:var(--ink-soft);border:none;border-radius:22px;padding:10px 22px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.06);}
.tab.active{background:var(--teal);color:#fff;}

/* 首页主入口 */
.hero{background:var(--teal);border-radius:var(--radius);padding:26px 26px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;cursor:pointer;box-shadow:0 6px 0 var(--teal-d);gap:16px;}
.hero .t{font-size:30px;font-weight:800;color:#fff;}
.hero .s{font-size:17px;color:#E1F5EE;margin-top:6px;}
.hero .go{background:#fff;color:var(--teal-d);border-radius:16px;padding:16px 26px;font-size:22px;font-weight:800;white-space:nowrap;}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
.entry{border-radius:20px;padding:22px 18px;cursor:pointer;position:relative;min-height:132px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.08);}
.entry .ei{font-size:40px;margin-bottom:8px;}
.entry .en{font-size:21px;font-weight:800;}
.entry .ed{font-size:14px;margin-top:4px;opacity:.85;}
.entry.amber{background:#FAEEDA;color:#633806;}
.entry.coral{background:#FCEBEB;color:#791F1F;}
.entry.green{background:#EAF3DE;color:#27500A;}
.entry.purple{background:#EEEDFE;color:#26215C;}
.badge{position:absolute;top:12px;right:12px;background:var(--coral);color:#fff;border-radius:14px;font-size:15px;font-weight:800;padding:3px 11px;min-width:26px;text-align:center;}

/* 通用返回头 */
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.btn-back{background:var(--card);border:none;border-radius:16px;padding:12px 20px;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.06);}
.page-title{font-size:22px;font-weight:800;}
.icon-btn{background:var(--card);border:none;border-radius:16px;width:52px;height:52px;font-size:24px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.06);}
.icon-btn.on{background:var(--amber);}

/* 游戏区 */
.game-wrap{background:#FDF3DE;border-radius:var(--radius);padding:18px;}
.progress{height:16px;background:#FAC775;border-radius:10px;overflow:hidden;margin:6px 0 8px;}
.progress > i{display:block;height:100%;background:var(--amber);width:0;transition:width .3s;}
.hint{text-align:center;font-size:18px;color:var(--amber-d);font-weight:700;margin-bottom:16px;}
.tile-row{display:grid;gap:16px;margin-bottom:16px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));}
.tile{border-radius:20px;padding:0 8px;text-align:center;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff;border:5px solid;transition:transform .12s;min-height:110px;line-height:1.2;}
.tile.en{color:var(--blue-d);border-color:#85B7EB;font-size:30px;}
.tile.cn{color:var(--coral-d);border-color:#F0997B;font-size:30px;}
.tile:active{transform:scale(.96);}
.tile.sel{background:var(--blue);color:#fff;border-color:var(--blue-d);transform:scale(1.03);}
.tile.cn.sel{background:var(--coral);border-color:var(--coral-d);color:#fff;}
.tile.matched{opacity:0;transform:scale(.3) rotate(12deg);pointer-events:none;transition:transform .4s,opacity .4s;}
.tile.wrong{animation:shake .45s;}
.tile.good{animation:pop .35s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-10px);}40%{transform:translateX(10px);}60%{transform:translateX(-8px);}80%{transform:translateX(8px);}}
@keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);}}
.game-foot{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;}
.last-clear{flex:1;min-width:180px;background:#EAF3DE;border-radius:16px;padding:14px;text-align:center;font-size:17px;color:var(--green);font-weight:700;}
.btn-skip{background:#fff;border:none;border-radius:16px;padding:14px 22px;font-size:17px;font-weight:700;color:var(--ink-soft);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.06);}

/* 过关横幅 */
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);background:#fff;border-radius:24px;padding:26px 40px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:10000;text-align:center;transition:transform .3s;}
.toast.show{transform:translate(-50%,-50%) scale(1);}
.toast .big{font-size:52px;}
.toast .msg{font-size:24px;font-weight:800;color:var(--teal-d);margin-top:6px;}

/* 词表（错题/已掌握/复习） */
.wordlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
.word-card{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:0 4px 0 rgba(0,0,0,.06);cursor:pointer;}
.word-card .we{font-size:24px;font-weight:800;color:var(--blue-d);}
.word-card .wz{font-size:19px;color:var(--ink-soft);margin-top:4px;}
.word-card .wm{font-size:13px;color:#9a8c73;margin-top:8px;display:flex;justify-content:space-between;}
.word-card.wrongc{border-left:8px solid var(--coral);}
.word-card.rightc{border-left:8px solid var(--green);}
.word-card .wm .prof{color:#e8a200;font-weight:700;}
.empty{text-align:center;color:var(--ink-soft);font-size:19px;padding:50px 20px;}
.empty .ei{font-size:56px;margin-bottom:10px;}

/* 成就 */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;}
.badge-card{background:var(--card);border-radius:20px;padding:20px 14px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.06);}
.badge-card .bi{font-size:46px;}
.badge-card.locked{opacity:.4;filter:grayscale(1);}
.badge-card .bn{font-size:17px;font-weight:800;margin-top:8px;}
.badge-card .bd{font-size:13px;color:var(--ink-soft);margin-top:4px;}

/* 单元选择弹层 */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10001;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:80%;overflow:auto;padding:20px;}
.sheet h3{font-size:20px;margin:0 0 12px;}
.diff-row{display:flex;gap:10px;margin-bottom:16px;}
.diff{flex:1;background:var(--card);border:none;border-radius:16px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.06);color:var(--ink);}
.diff.active{background:var(--amber);color:#fff;}
.unit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
@media(min-width:560px){.unit-grid{grid-template-columns:repeat(3,1fr);}}
.unit-chip{background:var(--card);border:none;border-radius:14px;padding:14px 10px;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.06);text-align:center;}
.unit-chip.active{background:var(--teal);color:#fff;}
.sheet-actions{display:flex;gap:12px;}
.btn-primary{flex:1;background:var(--teal);color:#fff;border:none;border-radius:18px;padding:16px;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--teal-d);}
.btn-ghost{background:#fff;border:none;border-radius:18px;padding:16px 20px;font-size:18px;font-weight:700;color:var(--ink-soft);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.06);}

.speak-hint{font-size:14px;color:var(--ink-soft);text-align:center;margin-top:8px;}

/* 导出/导入进度 */
.backup-bar{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap;background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 rgba(0,0,0,.06);}
.backup-btn{background:var(--teal);color:#fff;border:none;border-radius:16px;padding:13px 20px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--teal-d);}
.backup-tip{font-size:13px;color:var(--ink-soft);}
.code-box{width:100%;height:120px;margin:12px 0;border-radius:14px;border:3px solid #FAC775;padding:12px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink-soft);background:#FFFDF6;resize:none;word-break:break-all;}
.file-row{display:flex;align-items:center;gap:12px;margin:6px 0;}
.file-row label{cursor:pointer;}
.impfname{font-size:13px;color:var(--teal-d);font-weight:700;}
.impmsg{font-size:15px;font-weight:700;min-height:22px;margin:8px 0;}
.impmsg.ok{color:var(--green);} .impmsg.err{color:var(--coral);}

/* ========== 响应式多档判断 ========== */
/* 棋盘容器：默认（iPad/Mac 横排：上英文一行 + 下中文一行），.board 不干预布局 */
.board{display:contents;}

/* ① 手机竖屏（iPhone 竖持）：改为左列英文 + 右列中文，两列竖排更好点 */
@media (max-width:620px) and (orientation:portrait){
  .board{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .tile-row{grid-template-columns:1fr;gap:12px;margin-bottom:0;}
  .tile{min-height:84px;font-size:24px;border-width:4px;border-radius:16px;}
  .tile.en{font-size:23px;}
  .tile.cn{font-size:23px;}
  .app{padding:12px 12px 30px;}
  .brand .logo{width:44px;height:44px;font-size:24px;border-radius:12px;}
  .brand h1{font-size:20px;}
  .brand p{font-size:12px;}
  .chip{padding:6px 10px;min-width:52px;}
  .chip .ico{font-size:16px;}
  .chip .val{font-size:15px;}
  .hero{padding:18px;flex-direction:column;align-items:flex-start;}
  .hero .t{font-size:23px;}
  .hero .s{font-size:14px;}
  .hero .go{align-self:stretch;text-align:center;padding:13px;font-size:19px;}
  .entry{min-height:108px;padding:16px 14px;}
  .entry .ei{font-size:32px;}
  .entry .en{font-size:18px;}
  .game-wrap{padding:12px;}
  .hint{font-size:15px;margin-bottom:12px;}
  .page-title{font-size:18px;}
  .btn-back{padding:10px 14px;font-size:16px;}
  .toast{padding:20px 28px;}
  .toast .big{font-size:42px;}
  .toast .msg{font-size:19px;}
  .wordlist{grid-template-columns:1fr 1fr;gap:10px;}
  .word-card{padding:12px;}
  .word-card .we{font-size:19px;}
  .word-card .wz{font-size:15px;}
}

/* ② 手机竖屏 + 5对挑战档：方块再收一点，保证 5+5 一屏放下 */
@media (max-width:620px) and (orientation:portrait) and (max-height:750px){
  .board[style*="--n:5"] .tile{min-height:66px;font-size:19px;}
  .board[style*="--n:4"] .tile{min-height:76px;font-size:21px;}
}

/* ③ 手机横屏（屏幕很矮）：保持上下两排，整体压扁 */
@media (max-height:480px) and (orientation:landscape){
  .app{padding:8px 14px 20px;}
  .topbar{margin-bottom:8px;}
  .brand .logo{width:38px;height:38px;font-size:20px;border-radius:10px;}
  .brand h1{font-size:18px;}
  .brand p{display:none;}
  .chip{padding:4px 10px;}
  .chip .ico{font-size:14px;}
  .chip .val{font-size:14px;}
  .tabs{margin-bottom:8px;}
  .tab{padding:7px 16px;font-size:14px;}
  .hero{padding:14px 18px;margin-bottom:10px;}
  .hero .t{font-size:20px;}
  .hero .s{font-size:13px;margin-top:2px;}
  .hero .go{padding:10px 18px;font-size:16px;}
  .entry{min-height:84px;padding:12px;}
  .entry .ei{font-size:26px;margin-bottom:4px;}
  .entry .en{font-size:16px;}
  .entry .ed{display:none;}
  .game-wrap{padding:10px;}
  .progress{height:10px;margin:2px 0 4px;}
  .hint{font-size:14px;margin-bottom:8px;}
  .tile-row{gap:10px;margin-bottom:10px;}
  .tile{min-height:64px;font-size:20px;border-width:4px;border-radius:14px;}
  .tile.en,.tile.cn{font-size:20px;}
  .page-head{margin-bottom:8px;}
  .page-title{font-size:17px;}
  .btn-back{padding:8px 14px;font-size:15px;}
  .icon-btn{width:42px;height:42px;font-size:19px;}
  .game-foot{margin-top:2px;}
  .last-clear{padding:8px;font-size:14px;min-width:120px;}
  .btn-skip{padding:8px 16px;font-size:14px;}
  .speak-hint{display:none;}
}

/* ④ 中等竖屏（iPad 竖持 / 大屏手机竖屏）：略收紧但保持上下排 */
@media (min-width:621px) and (max-width:860px) and (orientation:portrait){
  .tile{min-height:96px;}
  .tile.en,.tile.cn{font-size:26px;}
}

</style>
</head>

(function (root) {

  var COLORS = ["#EF9F27", "#1D9E75", "#378ADD", "#E24B4A", "#D4537E", "#7F77DD", "#97C459"];

    var originX = opts.x != null ? opts.x : window.innerWidth / 2;
    var originY = opts.y != null ? opts.y : window.innerHeight / 3;

    var canvas = document.createElement("canvas");
    canvas.style.cssText =
      "position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999;";
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    var ctx = canvas.getContext("2d");

    var parts = [];
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 4 + Math.random() * 9;
      parts.push({
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        size: 6 + Math.random() * 8,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.4,
        life: 0,
        maxLife: 60 + Math.random() * 40

    }

    var raf;
    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var alive = false;
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        if (p.life > p.maxLife) continue;
        alive = true;
        p.life++;
        p.vy += 0.28;
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        var alpha = 1 - p.life / p.maxLife;
        ctx.save();
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      }
      if (alive) {

    var levels = [["L1", "一级 Level 1"], ["L2", "二级 Level 2"], ["ALL", "全部混合"]];
    var tabs = levels.map(function (x) {
      return '<button class="tab ' + (lv === x[0] ? "active" : "") + '" data-act="setlevel" data-lv="' + x[0] + '">' + x[1] + '</button>';
    }).join("");

    show(topbarHtml() +
      '<div class="tabs">' + tabs + '</div>' +
      '<div class="hero" data-act="openplay"><div><div class="t">🎯 单词消消乐</div><div class="s">英文配中文，配对消除，闯关得星星</div></div><div class="go">开始 ▶</div></div>' +
      '<div class="grid">' +
      '<div class="entry amber" data-act="review"><div class="ei">📅</div><div class="en">今日复习</div><div class="ed">遗忘曲线智能推送</div>' + (due > 0 ? '<div class="badge">' + due + '</div>' : '') + '</div>' +
      '<div class="entry coral" data-act="wrong"><div class="ei">📕</div><div class="en">错题本</div><div class="ed">错过的都在这里练</div></div>' +
      '<div class="entry green" data-act="mastered"><div class="ei">✅</div><div class="en">已掌握</div><div class="ed">你认识的单词墙</div></div>' +
      '<div class="entry purple" data-act="badges"><div class="ei">🏆</div><div class="en">成就 · 徽章</div><div class="ed">收集勋章看进度</div></div>' +
      '</div>' +
      '<div class="backup-bar">' +
      '<button class="backup-btn" data-act="export">⬇️ 导出进度</button>' +
      '<button class="backup-btn" data-act="import">⬆️ 导入进度</button>' +
      '<span class="backup-tip">换设备/换浏览器时用：先导出，再到另一台导入</span>' +
      '</div>');
  }

  /* ---------------- 导出 / 导入进度（跨设备） ---------------- */
  function openExport() {
    var code = G.encodeState(state);
    var mask = document.createElement("div");
    mask.className = "sheet-mask";
    mask.innerHTML = '<div class="sheet">' +
      '<h3>导出进度</h3>' +
      '<p class="speak-hint">把下面的内容复制，或下载文件，发到另一台设备（微信/备忘录/隔空投送都行）。在新设备上「导入进度」即可继续。</p>' +
      '<textarea class="code-box" id="expcode" readonly>' + code + '</textarea>' +
      '<div class="sheet-actions">' +
      '<button class="btn-ghost" data-act="copycode">📋 复制</button>' +
      '<button class="btn-ghost" data-act="dlfile">💾 下载文件</button>' +
      '<button class="btn-primary" data-act="closesheet">完成</button>' +
      '</div></div>';
    document.body.appendChild(mask);
    mask.addEventListener("click", function (e) {
      if (e.target === mask) { mask.remove(); return; }
      var t = e.target.closest("[data-act]"); if (!t) return;
      var act = t.getAttribute("data-act");
      if (act === "closesheet") mask.remove();
      else if (act === "copycode") {
        var ta = document.getElementById("expcode");
        ta.focus(); ta.select();
        var done = function () { t.textContent = "✅ 已复制"; setTimeout(function () { t.textContent = "📋 复制"; }, 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(done, function () { try { document.execCommand("copy"); done(); } catch (e2) {} });
        } else {
          try { document.execCommand("copy"); done(); } catch (e2) {}
        }
      } else if (act === "dlfile") {
        try {
          var blob = new Blob([code], { type: "text/plain;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url; a.download = "powerup进度.txt";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        } catch (e) {}
      }
    });
  }

  function openImport() {
    var mask = document.createElement("div");
    mask.className = "sheet-mask";
    mask.innerHTML = '<div class="sheet">' +
      '<h3>导入进度</h3>' +
      '<p class="speak-hint">把另一台设备「导出」的内容粘贴进来，或选择导出的文件。导入会合并两边进度，不会丢失任何一边。</p>' +
      '<textarea class="code-box" id="impcode" placeholder="在此粘贴导出的内容…"></textarea>' +
      '<div class="file-row"><label class="btn-ghost">📁 选择文件<input type="file" id="impfile" accept=".txt,.json,.html" style="display:none"></label>' +
      '<span id="impfname" class="impfname"></span></div>' +
      '<div id="impmsg" class="impmsg"></div>' +
      '<div class="sheet-actions">' +
      '<button class="btn-ghost" data-act="closesheet">取消</button>' +
      '<button class="btn-primary" data-act="doimport">导入 ▶</button>' +
      '</div></div>';
    document.body.appendChild(mask);
    var fileInput = mask.querySelector("#impfile");
    var fname = mask.querySelector("#impfname");
    fileInput.addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      fname.textContent = f.name;
      var reader = new FileReader();
      reader.onload = function () { mask.querySelector("#impcode").value = String(reader.result).trim(); };
      reader.readAsText(f);
    });
    mask.addEventListener("click", function (e) {
      if (e.target === mask) { mask.remove(); return; }
      var t = e.target.closest("[data-act]"); if (!t) return;
      var act = t.getAttribute("data-act");
      if (act === "closesheet") mask.remove();
      else if (act === "doimport") {
        var raw = mask.querySelector("#impcode").value;
        var incoming = G.decodeState(raw);
        var msg = mask.querySelector("#impmsg");
        if (!incoming) { msg.textContent = "❌ 内容无效，请重新粘贴或选择正确文件"; msg.className = "impmsg err"; return; }
        var before = Object.keys(state.progress).length;
        state = G.mergeState(state, incoming);
        save();
        msg.textContent = "✅ 导入成功！已合并 " + Object.keys(incoming.progress).length + " 个词的进度（原有 " + before + " 个，现共 " + Object.keys(state.progress).length + " 个）";
        msg.className = "impmsg ok";
        setTimeout(function () { mask.remove(); renderHome(); }, 1400);
      }
    });
  }

  /* ---------------- 单元选择弹层 ---------------- */
  function openPlaySheet() {
    var lv = state.settings.level;
    var diff = state.settings.difficulty;
    var selUnits = state.settings.units; // "ALL" 或数组
    var unitKeys = [];
    if (lv === "ALL") unitKeys = [];
    else unitKeys = Object.keys(BANK[lv].units);

    function diffBtns() {
      return ["easy", "mid", "hard"].map(function (d) {
        return '<button class="diff ' + (diff === d ? "active" : "") + '" data-act="setdiff" data-d="' + d + '">' + DIFF_LABEL[d] + '</button>';
      }).join("");
    }
    function unitBtns() {
      if (lv === "ALL") return '<div class="speak-hint">全部混合模式：一级二级所有单词随机出现</div>';
      var all = '<button class="unit-chip ' + (selUnits === "ALL" ? "active" : "") + '" data-act="setunit" data-u="ALL">全部单元</button>';
      var chips = unitKeys.map(function (u) {
        var active = Array.isArray(selUnits) && selUnits.indexOf(u) !== -1;
        return '<button class="unit-chip ' + (active ? "active" : "") + '" data-act="setunit" data-u="' + u + '">' + BANK[lv].units[u].title + '</button>';
      }).join("");
      return all + chips;
    }
    var mask = document.createElement("div");
    mask.className = "sheet-mask";
    mask.innerHTML = '<div class="sheet">' +
      '<h3>选择难度</h3><div class="diff-row">' + diffBtns() + '</div>' +
      '<h3>选择范围（' + (lv === "ALL" ? "全部混合" : BANK[lv].title) + '）</h3><div class="unit-grid">' + unitBtns() + '</div>' +
      '<div class="sheet-actions"><button class="btn-ghost" data-act="closesheet">取消</button><button class="btn-primary" data-act="startplay">开始游戏 ▶</button></div>' +
      '</div>';
    document.body.appendChild(mask);

    mask.addEventListener("click", function (e) {
      if (e.target === mask) { mask.remove(); return; }
      var t = e.target.closest("[data-act]"); if (!t) return;
      var act = t.getAttribute("data-act");
      if (act === "setdiff") { state.settings.difficulty = t.getAttribute("data-d"); save(); mask.remove(); openPlaySheet(); }
      else if (act === "setunit") {
        var u = t.getAttribute("data-u");
        if (u === "ALL") state.settings.units = "ALL";
        else {
          var cur = Array.isArray(state.settings.units) ? state.settings.units.slice() : [];
          var i = cur.indexOf(u);
          if (i === -1) cur.push(u); else cur.splice(i, 1);
          state.settings.units = cur.length ? cur : "ALL";
        }
        save(); mask.remove(); openPlaySheet();
      }
      else if (act === "closesheet") mask.remove();
      else if (act === "startplay") { mask.remove(); startGame("play"); }
    });
  }

  /* ---------------- 游戏 ---------------- */
  var session = null;
  function startGame(source) {
    bumpStreak();
    var roundSize = DIFFS[state.settings.difficulty] || 3;
    var pool;
    if (source === "review") {
      var base = currentPool();
      var due = G.pickDueWords(base, state.progress, Date.now());
      if (due.length < roundSize + 1) {
        // 到期不足，用全部当前范围补齐，仍智能优先
        pool = base;
      } else {
        pool = due.concat(base); // 去重由 buildPool 保证 base 唯一；此处只需保证足够
      }
      if (base.length < roundSize + 1) pool = fullPool();
    } else {
      pool = currentPool();
      if (pool.length < roundSize + 1) pool = fullPool();
    }
    session = { source: source, roundSize: roundSize, pool: pool, level: 1, selEn: null, selCn: null, cleared: 0, round: null, locked: false };
    nextRound();
    renderGame();
  }

  function nextRound() {
    var rs = session.roundSize;
    var words = G.pickRoundWords(session.pool, rs + 1, state.progress, Date.now(), Math.random, true);
    session.round = G.buildRoundFromWords(words, rs, Math.random);
    session.selEn = null; session.selCn = null; session.cleared = 0; session.locked = false;
  }

  function tileHtml(t) {
    return '<div class="tile ' + t.side + '" data-tile="' + t.tileId + '" data-word="' + t.wordId + '" data-side="' + t.side + '">' + t.text + '</div>';
  }
  function renderGame() {
    var r = session.round;
    var total = r.correctPairIds.length;
    var pct = Math.round((session.cleared / total) * 100);
    var head = '<div class="page-head"><button class="btn-back" data-act="home">← 返回</button>' +
      '<div class="page-title">第 ' + session.level + ' 关 · ⭐ ' + state.stats.stars + '</div>' +
      '<button class="icon-btn ' + (state.settings.sound ? "on" : "") + '" data-act="togglesound">' + (state.settings.sound ? "🔊" : "🔇") + '</button></div>';
    var game = '<div class="game-wrap">' +
      '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
      '<div class="hint">' + (session.source === "review" ? "复习模式 · " : "") + '找出配对的英文和中文 👇 已配对 ' + session.cleared + '/' + total + '</div>' +
      '<div class="board" style="--n:' + r.roundSize + '">' +
      '<div class="tile-row" id="row-en">' + r.enTiles.map(tileHtml).join("") + '</div>' +
      '<div class="tile-row" id="row-cn">' + r.cnTiles.map(tileHtml).join("") + '</div>' +
      '</div>' +
      '<div class="game-foot"><div class="last-clear" id="lastclear">选一个英文，再选一个中文，配对成功就消除 🎉</div>' +
      '<button class="btn-skip" data-act="skip">换一批 ⏭</button></div>' +
      '</div><div class="speak-hint">点方块会读出发音（英式）</div>';
    show(head + game);
  }

  function tileEl(id) { return document.querySelector('[data-tile="' + id + '"]'); }

  function onTileTap(el) {
    if (session.locked) return;
    var side = el.getAttribute("data-side");
    var tileId = el.getAttribute("data-tile");
    var wordId = el.getAttribute("data-word");
    if (el.classList.contains("matched")) return;

    // 发音
    if (side === "en") speak(el.textContent, "en-GB");
    else speak(el.textContent, "zh-CN");

    if (side === "en") {
      if (session.selEn === tileId) { session.selEn = null; el.classList.remove("sel"); return; }
      if (session.selEn) { var old = tileEl(session.selEn); old && old.classList.remove("sel"); }
      session.selEn = tileId; el.classList.add("sel");
    } else {
      if (session.selCn === tileId) { session.selCn = null; el.classList.remove("sel"); return; }
      if (session.selCn) { var oldc = tileEl(session.selCn); oldc && oldc.classList.remove("sel"); }
      session.selCn = tileId; el.classList.add("sel");
    }
    if (session.selEn && session.selCn) evaluate();
  }

  function evaluate() {
    var enEl = tileEl(session.selEn), cnEl = tileEl(session.selCn);
    var r = session.round;
    var enTile = r.enTiles.find(function (t) { return t.tileId === session.selEn; });
    var cnTile = r.cnTiles.find(function (t) { return t.tileId === session.selCn; });
    var matched = G.checkMatch(enTile, cnTile);
    session.locked = true;

    if (matched) {
      record(wordFromId(enTile.wordId), true);
      beep("good");
      enEl.classList.add("good"); cnEl.classList.add("good");
      setTimeout(function () {
        enEl.classList.add("matched"); cnEl.classList.add("matched");
        session.cleared += 1;
        var last = document.getElementById("lastclear");
        if (last) last.textContent = "✅ 已消除：" + enTile.en + " - " + cnTile.zh;
        session.selEn = null; session.selCn = null; session.locked = false;
        var total = r.correctPairIds.length;
        var prog = document.querySelector(".progress > i");
        if (prog) prog.style.width = Math.round((session.cleared / total) * 100) + "%";
        var hint = document.querySelector(".hint");
        if (hint) hint.textContent = (session.source === "review" ? "复习模式 · " : "") + "找出配对的英文和中文 👇 已配对 " + session.cleared + "/" + total;
        if (session.cleared >= total) roundComplete();
      }, 320);
    } else {
      // 记英文侧为错
      record(wordFromId(enTile.wordId), false);
      beep("bad");
      enEl.classList.add("wrong"); cnEl.classList.add("wrong");
      setTimeout(function () {
        enEl.classList.remove("wrong", "sel"); cnEl.classList.remove("wrong", "sel");
        session.selEn = null; session.selCn = null; session.locked = false;
        var last = document.getElementById("lastclear");
        if (last) last.textContent = "再试试～ (" + enTile.en + " 不是 " + cnTile.zh + ")";
      }, 480);
    }
  }

  function roundComplete() {
    state.stats.matches += session.round.correctPairIds.length;
    state.stats.rounds += 1;
    state.stats.stars += 10 + session.round.correctPairIds.length * 2;
    state.stats.perfectRounds += 1;
    save();
    beep("win");
    try { window.Confetti && window.Confetti.burst({ y: window.innerHeight / 3 }); } catch (e) {}
    showToast("🎉", "太棒了！过关啦");
    setTimeout(function () {
      session.level += 1;
      nextRound();
      renderGame();
    }, 1400);
  }

  function showToast(big, msg) {
    var t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = '<div class="big">' + big + '</div><div class="msg">' + msg + '</div>';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.classList.add("show"); });
    setTimeout(function () { t.classList.remove("show"); setTimeout(function () { t.remove(); }, 300); }, 1200);
  }

  /* ---------------- 词表页 ---------------- */
  function listPage(title, cards, emptyIco, emptyMsg) {
    var body = cards.length
      ? '<div class="wordlist">' + cards + '</div>'
      : '<div class="empty"><div class="ei">' + emptyIco + '</div>' + emptyMsg + '</div>';
    show('<div class="page-head"><button class="btn-back" data-act="home">← 返回</button><div class="page-title">' + title + '</div><div style="width:52px"></div></div>' + body);
  }
  function fmtDate(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    return (d.getMonth() + 1) + "/" + d.getDate();
  }
  function renderWrong() {
    var items = Object.keys(state.progress).map(function (id) { return state.progress[id]; })
      .filter(function (p) { return p.wrong > 0; })
      .sort(function (a, b) { return b.wrong - a.wrong || b.lastSeen - a.lastSeen; });
    var cards = items.map(function (p) {
      return '<div class="word-card wrongc" data-act="say" data-en="' + p.en + '"><div class="we">' + p.en + '</div><div class="wz">' + p.zh + '</div>' +
        '<div class="wm"><span>错 ' + p.wrong + ' 次</span><span>' + fmtDate(p.lastSeen) + '</span></div></div>';
    }).join("");
    listPage("📕 错题本", cards, "🎈", "还没有错题，太厉害啦！");
  }
  function isProficient(p) { return p.box >= 4 || (p.correct >= 3 && p.wrong === 0); }
  function renderMastered() {
    var items = Object.keys(state.progress).map(function (id) { return state.progress[id]; })
      .filter(function (p) { return p.correct >= 1; })
      .sort(function (a, b) {
        var pa = isProficient(a) ? 1 : 0, pb = isProficient(b) ? 1 : 0;
        return pb - pa || b.correct - a.correct || b.box - a.box;
      });
    var profCount = items.filter(isProficient).length;
    var cards = items.map(function (p) {
      var tag = isProficient(p) ? '<span class="prof">🌟 熟练</span>' : '<span>Lv.' + p.box + '</span>';
      var wrongTxt = p.wrong > 0 ? ' · 错 ' + p.wrong + ' 次' : '';
      return '<div class="word-card rightc" data-act="say" data-en="' + p.en + '"><div class="we">' + p.en + '</div><div class="wz">' + p.zh + '</div>' +
        '<div class="wm"><span>对 ' + p.correct + ' 次' + wrongTxt + '</span>' + tag + '</div></div>';
    }).join("");
    var head = items.length ? '<div style="margin-bottom:12px;color:var(--ink-soft);font-size:16px">会认 ' + items.length + ' 个 · 其中 🌟熟练 ' + profCount + ' 个（连对3次不出错）</div>' : "";
    listPage("✅ 已掌握", head + cards, "🌱", "还没有掌握的单词，快去消消乐吧！");
  }
  function renderReviewList() {
    var pool = currentPool();
    var due = G.pickDueWords(pool, state.progress, Date.now());
    if (due.length === 0) {
      listPage("📅 今日复习", "", "🌈", "今天没有需要复习的单词，休息一下吧～");
      return;
    }
    var cards = due.map(function (w) {
      var p = state.progress[w.id];
      return '<div class="word-card wrongc" data-act="say" data-en="' + w.en + '"><div class="we">' + w.en + '</div><div class="wz">' + w.zh + '</div>' +
        '<div class="wm"><span>盒子 ' + p.box + '</span><span>错 ' + p.wrong + '</span></div></div>';
    }).join("");
    var startBtn = '<div style="margin:16px 0"><button class="btn-primary" data-act="startreview">开始复习这些单词 ▶</button></div>';
    show('<div class="page-head"><button class="btn-back" data-act="home">← 返回</button><div class="page-title">📅 今日复习（' + due.length + '）</div><div style="width:52px"></div></div>' + startBtn + '<div class="wordlist">' + cards + '</div>');
  }
  function renderBadges() {
    var s = state.stats;
    var mastered = Object.keys(state.progress).filter(function (id) { return state.progress[id].correct >= 1; }).length;
    var defs = [
      { ico: "🥇", name: "初次通关", desc: "完成第一关", got: s.rounds >= 1 },
      { ico: "🔥", name: "坚持3天", desc: "连续打卡3天", got: (s.streak || 0) >= 3 },
      { ico: "⭐", name: "星星达人", desc: "累计100星", got: (s.stars || 0) >= 100 },
      { ico: "🌱", name: "小小词汇", desc: "掌握10个词", got: mastered >= 10 },
      { ico: "🌟", name: "词汇小达人", desc: "掌握50个词", got: mastered >= 50 },
      { ico: "💯", name: "百次消除", desc: "累计消除100对", got: (s.matches || 0) >= 100 },
      { ico: "🏆", name: "闯关高手", desc: "通关20次", got: (s.rounds || 0) >= 20 },
      { ico: "👑", name: "单词之王", desc: "掌握100个词", got: mastered >= 100 }
    ];
    var cards = defs.map(function (b) {
      return '<div class="badge-card ' + (b.got ? "" : "locked") + '"><div class="bi">' + b.ico + '</div><div class="bn">' + b.name + '</div><div class="bd">' + b.desc + '</div></div>';
    }).join("");
    show('<div class="page-head"><button class="btn-back" data-act="home">← 返回</button><div class="page-title">🏆 成就 · 徽章</div><div style="width:52px"></div></div>' +
      '<div style="margin-bottom:14px;color:var(--ink-soft);font-size:16px">已掌握 ' + mastered + ' 词 · 通关 ' + (s.rounds || 0) + ' 次 · ⭐ ' + (s.stars || 0) + '</div>' +
      '<div class="badges">' + cards + '</div>');
  }

  /* ---------------- 全局事件委托 ---------------- */
  document.addEventListener("click", function (e) {
    var tileT = e.target.closest(".tile");
    if (tileT && document.getElementById("row-en")) { onTileTap(tileT); return; }
    var t = e.target.closest("[data-act]"); if (!t) return;
    var act = t.getAttribute("data-act");
    switch (act) {
      case "home": renderHome(); break;
      case "setlevel": state.settings.level = t.getAttribute("data-lv"); if (state.settings.level === "ALL") state.settings.units = "ALL"; save(); renderHome(); break;
      case "openplay": openPlaySheet(); break;
      case "review": renderReviewList(); break;
      case "startreview": startGame("review"); break;
      case "wrong": renderWrong(); break;
      case "mastered": renderMastered(); break;
      case "badges": renderBadges(); break;
      case "skip": nextRound(); renderGame(); break;
      case "togglesound": state.settings.sound = !state.settings.sound; save(); renderGame(); break;
      case "say": speak(t.getAttribute("data-en"), "en-GB"); break;
      case "export": openExport(); break;
      case "import": openImport(); break;
    }
  });

  renderHome();
})();

</script>
</body>
</html>
